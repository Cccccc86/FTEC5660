<g text-anchor="middle" font-size="16">
<text x="127" y="139" font-weight="bold">Receipt image</text><text x="127" y="168">Base64 data URL</text>
<text x="445" y="131" font-weight="bold">LangChain extraction</text><text x="445" y="158">deepseek-v4-flash-vision-exp</text><text x="445" y="181">Prompt + image → JSON fields</text>
<text x="858" y="131" font-weight="bold">Python checks</text><text x="858" y="158">Items − discounts = subtotal</text><text x="858" y="181">Subtotal + rounding = payment</text>
<text x="858" y="294" font-weight="bold">One targeted reread</text><text x="858" y="321">Arithmetic feedback + enlarged views</text><text x="858" y="344">Same model; no further loop</text>
<text x="445" y="294" font-weight="bold">Select the receipt amounts</text><text x="445" y="321">Use a checked reading when possible</text><text x="445" y="344">Warn if checks remain unresolved</text>
<text x="653" y="448" font-weight="bold">Sum with Decimal → two HKD responses → supplied CSV writer</text>
<text x="653" y="472" font-size="14">Q1: sum(payment)     |     Q2: sum(original item line totals); rounding is not an item</text>
</g>
