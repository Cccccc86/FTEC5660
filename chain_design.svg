<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-label="Receipt chain: extract fields, check arithmetic, reread doubtful receipts once with enlarged views, then sum amounts in Python">
